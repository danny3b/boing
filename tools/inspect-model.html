<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>Inspekcja modelu</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<pre id="out">ładowanie…</pre>
<script type="module">
// Narzędzie deweloperskie: czyta FBX z tools/model-src, wypisuje statystyki i eksportuje GLB.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const out = document.getElementById('out');
const fbx = await new FBXLoader().loadAsync('model-src/girl.fbx');
fbx.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(fbx);
const info = { meshes: [], bones: [], clips: [], box: { min: box.min.toArray(), max: box.max.toArray() }, scale: fbx.scale.toArray() };
fbx.traverse((o) => {
  if (o.isMesh) info.meshes.push({ name: o.name, skinned: !!o.isSkinnedMesh, verts: o.geometry.attributes.position.count, tris: (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3, mat: [].concat(o.material).map((m) => m.type + ':' + m.name) });
  if (o.isBone) info.bones.push(o.name);
});
info.clips = fbx.animations.map((c) => ({ name: c.name, dur: c.duration, tracks: c.tracks.length, keys: c.tracks[0]?.times.length }));
window.MODEL = fbx;
window.INFO = info;

window.exportGLB = async (texFile = 'model-src/girl_base_1k.jpg') => {
  const tex = await new THREE.TextureLoader().loadAsync(texFile);
  tex.colorSpace = THREE.SRGBColorSpace;
  // flipY zostaje domyślne (true) — GLTFExporter sam odwraca obraz do konwencji glTF
  tex.userData.mimeType = 'image/jpeg'; // bez tego eksporter przepisuje do (ciężkiego) PNG
  fbx.traverse((o) => {
    if (!o.isMesh) return;
    // FBX przychodzi bez indeksów (każdy trójkąt osobno) — scalamy wspólne wierzchołki
    const g = o.geometry;
    g.deleteAttribute('normal');
    const merged = mergeVertices(g, 1e-4);
    merged.computeVertexNormals();
    o.geometry = merged;
    o.material = new THREE.MeshStandardMaterial({ name: 'girl', map: tex, roughness: 1, metalness: 0 });
  });
  // animacja: wyrzucamy ścieżki bez ruchu
  for (const clip of fbx.animations) {
    clip.name = 'walk';
    clip.tracks = clip.tracks.filter((t) => {
      const v = t.values, n = t.getValueSize();
      for (let i = n; i < v.length; i++) if (Math.abs(v[i] - v[i % n]) > 1e-5) return true;
      return false;
    });
  }
  const glb = await new GLTFExporter().parseAsync(fbx, { binary: true, animations: fbx.animations, onlyVisible: false });
  return glb;
};
out.textContent = JSON.stringify({ ...info, bones: info.bones.length + ' kości: ' + info.bones.slice(0, 70).join(', ') }, null, 2);
</script>
</body>
</html>
